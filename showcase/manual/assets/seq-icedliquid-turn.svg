<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 632" width="1120" height="632" role="img" aria-labelledby="iced-title iced-desc" class="dg-svg" data-diagram="iced"><title id="iced-title">icedLiquid: one voice turn with a tool call, all models in the tab</title><desc id="iced-desc">icedLiquid hears through the browser WebGPU ASR lane (voice_agent.asr_lane), checks the config phrase lists, thinks on the in-tab LFM3-Omni brain with tool specs, calls /api/agent-tools/&lt;name&gt; on the Next.js server and draws a card, then speaks the answer as streamed speech. Speaking over the answer (barge-in) stops it and the agent listens again.</desc><style>.dg-bg{fill:var(--brand-color-paper,#f9fafd)}
.dg-mask{fill:var(--brand-color-paper,#f9fafd)}
.dg-node{fill:#ffffff;stroke:var(--brand-color-fg,#121a2b);stroke-width:1}
.dg-focal{fill:rgba(10,93,254,0.08);stroke:var(--brand-color-primary,#0a5dfe);stroke-width:1.2}
.dg-store{fill:rgba(18,26,43,0.05);stroke:var(--brand-color-fg-secondary,#475061);stroke-width:1}
.dg-ext{fill:rgba(18,26,43,0.03);stroke:rgba(18,26,43,0.30);stroke-width:1}
.dg-e{fill:none;stroke:var(--brand-color-fg-secondary,#475061);stroke-width:1.2}
.dg-e-link{fill:none;stroke:#1046c1;stroke-width:1.2}
.dg-e-ret{fill:none;stroke:var(--brand-color-fg-secondary,#475061);stroke-width:1;stroke-dasharray:4 3}
.dg-e-accent{fill:none;stroke:var(--brand-color-primary,#0a5dfe);stroke-width:1.4}
.dg-life{fill:none;stroke:rgba(18,26,43,0.20);stroke-width:1;stroke-dasharray:3 3}
.dg-act{fill:rgba(18,26,43,0.06);stroke:var(--brand-color-fg-secondary,#475061);stroke-width:0.8}
.dg-frame{fill:rgba(18,26,43,0.02);stroke:rgba(18,26,43,0.22);stroke-width:1}
.dg-tab{fill:var(--brand-color-paper,#f9fafd);stroke:rgba(18,26,43,0.22);stroke-width:1}
.dg-head{fill:var(--brand-color-fg-secondary,#475061)}
.dg-head-link{fill:#1046c1}
.dg-head-accent{fill:var(--brand-color-primary,#0a5dfe)}
.dg-name{fill:var(--brand-color-fg,#121a2b);font-family:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;font-size:12px;font-weight:600}
.dg-sub{fill:var(--brand-color-fg-secondary,#475061);font-family:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;font-size:9px}
.dg-lbl{fill:var(--brand-color-fg-secondary,#475061);font-family:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;font-size:8px;letter-spacing:0.04em}
.dg-lbl-accent{fill:var(--brand-color-primary,#0a5dfe);font-family:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;font-size:8px;letter-spacing:0.04em;font-weight:500}
.dg-op{fill:var(--brand-color-fg-secondary,#475061);font-family:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;font-size:8px;letter-spacing:0.12em}</style><defs><marker id="iced-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon class="dg-head" points="0 0, 8 3, 0 6"/></marker><marker id="iced-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon class="dg-head-link" points="0 0, 8 3, 0 6"/></marker><marker id="iced-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon class="dg-head-accent" points="0 0, 8 3, 0 6"/></marker></defs><rect class="dg-bg" x="0" y="0" width="1120" height="632"/><g data-step="1"><path id="iced-life-you" class="dg-life" d="M100,96 V612"/><path id="iced-life-ears" class="dg-life" d="M284,96 V612"/><path id="iced-life-agent" class="dg-life" d="M468,96 V612"/><path id="iced-life-brain" class="dg-life" d="M652,96 V612"/><path id="iced-life-tools" class="dg-life" d="M836,96 V612"/><path id="iced-life-voice" class="dg-life" d="M1020,96 V612"/><rect x="96" y="128" width="8" height="24" class="dg-act"/><rect x="280" y="128" width="8" height="56" class="dg-act"/><rect x="464" y="160" width="8" height="416" class="dg-act"/><rect x="648" y="240" width="8" height="232" class="dg-act"/><rect x="832" y="336" width="8" height="56" class="dg-act"/><rect x="1016" y="480" width="8" height="56" class="dg-act"/><g data-hit="you" id="iced-a-you"><rect x="24" y="48" width="152" height="48" rx="6" class="dg-node"/><text x="100" y="68" class="dg-name" text-anchor="middle">You</text><text x="100" y="83" class="dg-sub" text-anchor="middle">mic + speaker</text></g><g data-hit="ears" id="iced-a-ears"><rect x="208" y="48" width="152" height="48" rx="6" class="dg-store"/><text x="284" y="68" class="dg-name" text-anchor="middle">Ears</text><text x="284" y="83" class="dg-sub" text-anchor="middle">asr_lane: browser</text></g><g data-hit="agent" id="iced-a-agent"><rect x="392" y="48" width="152" height="48" rx="6" class="dg-focal"/><text x="468" y="68" class="dg-name" text-anchor="middle">icedLiquid agent</text><text x="468" y="83" class="dg-sub" text-anchor="middle">turns · phrase lists</text></g><g data-hit="brain" id="iced-a-brain"><rect x="576" y="48" width="152" height="48" rx="6" class="dg-store"/><text x="652" y="68" class="dg-name" text-anchor="middle">Brain</text><text x="652" y="83" class="dg-sub" text-anchor="middle">LFM3-Omni · WebGPU</text></g><g data-hit="tools" id="iced-a-tools"><rect x="760" y="48" width="152" height="48" rx="6" class="dg-ext"/><text x="836" y="68" class="dg-name" text-anchor="middle">Agent tools</text><text x="836" y="83" class="dg-sub" text-anchor="middle">Next.js server</text></g><g data-hit="voice" id="iced-a-voice"><rect x="944" y="48" width="152" height="48" rx="6" class="dg-store"/><text x="1020" y="68" class="dg-name" text-anchor="middle">Voice</text><text x="1020" y="83" class="dg-sub" text-anchor="middle">speech codec · WebGPU</text></g></g><g data-step="2"><path id="iced-m1" class="dg-e" d="M104,136 H280" marker-end="url(#iced-arrow)"/><rect x="142" y="121" width="100" height="12" rx="2" class="dg-mask"/><text x="192" y="130" class="dg-lbl" text-anchor="middle">speech (VAD start)</text></g><g data-step="3"><path id="iced-m2" class="dg-e-ret" d="M288,168 H464" marker-end="url(#iced-arrow)"/><rect x="332" y="153" width="88" height="12" rx="2" class="dg-mask"/><text x="376" y="162" class="dg-lbl" text-anchor="middle">final transcript</text></g><g data-step="4"><path id="iced-m3" class="dg-e" d="M472,200 H504 Q512,200 512,208 V212 Q512,220 504,220 H476" marker-end="url(#iced-arrow)"/><text x="520" y="213" class="dg-lbl" text-anchor="start">phrase lists: theme · goodbye · language</text></g><g data-step="5"><path id="iced-m4" class="dg-e" d="M472,248 H648" marker-end="url(#iced-arrow)"/><rect x="490" y="233" width="140" height="12" rx="2" class="dg-mask"/><text x="560" y="242" class="dg-lbl" text-anchor="middle">think(history, tool specs)</text></g><g data-step="6"><rect x="444" y="268" width="420" height="160" rx="4" class="dg-frame"/><rect x="444" y="268" width="40" height="16" rx="2" class="dg-tab"/><text x="464" y="280" class="dg-op" text-anchor="middle">LOOP</text><rect x="492" y="271" width="180" height="12" rx="2" class="dg-mask"/><text x="496" y="280" class="dg-lbl" text-anchor="start">[up to voice_agent.max_tool_rounds]</text><path id="iced-m5" class="dg-e-ret" d="M648,312 H472" marker-end="url(#iced-arrow)"/><rect x="530" y="297" width="60" height="12" rx="2" class="dg-mask"/><text x="560" y="306" class="dg-lbl" text-anchor="middle">tool_calls</text></g><g data-step="7"><path id="iced-m6" class="dg-e-link" d="M472,344 H832" marker-end="url(#iced-arrow-link)"/><rect x="580" y="329" width="160" height="12" rx="2" class="dg-mask"/><text x="660" y="338" class="dg-lbl" text-anchor="middle">POST /api/agent-tools/&lt;name&gt;</text></g><g data-step="8"><path id="iced-m7" class="dg-e-ret" d="M832,376 H472" marker-end="url(#iced-arrow)"/><rect x="596" y="361" width="128" height="12" rx="2" class="dg-mask"/><text x="660" y="370" class="dg-lbl" text-anchor="middle">{ok, data} · draw card</text></g><g data-step="9"><path id="iced-m8" class="dg-e" d="M472,408 H648" marker-end="url(#iced-arrow)"/><rect x="528" y="393" width="64" height="12" rx="2" class="dg-mask"/><text x="560" y="402" class="dg-lbl" text-anchor="middle">tool result</text></g><g data-step="10"><path id="iced-m9" class="dg-e-ret" d="M648,456 H472" marker-end="url(#iced-arrow)"/><rect x="496" y="441" width="128" height="12" rx="2" class="dg-mask"/><text x="560" y="450" class="dg-lbl" text-anchor="middle">answer · grounding guard</text></g><g data-step="11"><path id="iced-m10" class="dg-e" d="M472,488 H1016" marker-end="url(#iced-arrow)"/><rect x="706" y="473" width="76" height="12" rx="2" class="dg-mask"/><text x="744" y="482" class="dg-lbl" text-anchor="middle">speak(answer)</text></g><g data-step="12"><path id="iced-m11" class="dg-e-accent" d="M1016,520 H104" marker-end="url(#iced-arrow-accent)"/><rect x="702" y="505" width="84" height="12" rx="2" class="dg-mask"/><text x="744" y="514" class="dg-lbl-accent" text-anchor="middle">streamed speech</text></g><g data-step="13"><path id="iced-m12" class="dg-e" d="M104,560 H464" marker-end="url(#iced-arrow)"/><rect x="200" y="545" width="168" height="12" rx="2" class="dg-mask"/><text x="284" y="554" class="dg-lbl" text-anchor="middle">barge-in: stop, listen again</text></g></svg>
